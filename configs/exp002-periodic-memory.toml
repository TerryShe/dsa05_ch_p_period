# EXP-DSA05-002 periodic memory (docs/experiment-designs/002-periodic-memory_20260925.md).
# Identical to exp001-constrained-mappo.toml (phase-1 short training) except that
# the actor also sees per-subchannel interference and own transmissions lagged
# by the traffic periods, and only the phase-1 selections remain as profiles.
[experiment]
id = "exp002-periodic-memory"
design = "docs/experiment-designs/002-periodic-memory_20260925.md"

[training]
budget_slots = 2000000
episode_slots = 600
num_envs = 16
rollout_slots = 128
entropy_start = 0.01
entropy_decay_fraction = 0.5
validation_every_slots = 250000
torch_threads = 1

[model]
hidden = 64
critic_hidden = 256
periodic_lags = [10, 20, 40]

[ppo]
actor_lr = 3e-4
critic_lr = 1e-3
gamma = 0.99
gae_lambda = 0.95
clip = 0.2
max_grad_norm = 0.5
ppo_epochs = 4
minibatch_envs = 4

# Penalty weights are in units of one max-power slot of energy, E0 = tau * p_max.
[constraint.fixed]
weight = 10.0

[constraint.global]
eta = 5.0
mu_init = 5.0
mu_max = 100.0

[constraint.local]
eta = 2.0
mu_max = 50.0
mu0 = 5.0
# Initial duals evaluated at every validation; the protocol rule picks (checkpoint, mu0).
mu0_candidates = [0.0, 5.0, 25.0]

# Phase-1 selections of EXP-DSA05-001, not re-tuned.
[profiles.fixed-w10]
variant = "fixed"
weight = 10.0

[profiles.local-eta2]
variant = "local"
eta = 2.0
mu_max = 50.0
