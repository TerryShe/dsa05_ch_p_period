# EXP-DSA05-001 constrained MAPPO (docs/experiment-designs/001-constrained-mappo_20260924.md).
# The scenario variant, constraint variant and seed are chosen on the command line.
# Constraint parameters are phase-0 defaults; phase 1 tunes them on validation only.
[experiment]
id = "exp001-constrained-mappo"
design = "docs/experiment-designs/001-constrained-mappo_20260924.md"

[training]
budget_slots = 2000000
episode_slots = 600
num_envs = 16
rollout_slots = 128
entropy_start = 0.01
entropy_decay_fraction = 0.5
validation_every_slots = 250000
torch_threads = 1

[model]
hidden = 64
critic_hidden = 256

[ppo]
actor_lr = 3e-4
critic_lr = 1e-3
gamma = 0.99
gae_lambda = 0.95
clip = 0.2
max_grad_norm = 0.5
ppo_epochs = 4
minibatch_envs = 4

# Penalty weights are in units of one max-power slot of energy, E0 = tau * p_max.
[constraint.fixed]
weight = 10.0

[constraint.global]
eta = 5.0
mu_init = 5.0
mu_max = 100.0

[constraint.local]
eta = 2.0
mu_max = 50.0
mu0 = 5.0
