# EXP-DSA05-008 round 2, condition C-600: variant C (local per-UE duals) with 600-slot training episodes (design §5).
# Built on B1 = R0 (round 1, docs/results/exp008-round1_20261003/report.md): apart
# from [experiment] the file differs from configs/exp008-round1-r0.toml only in
# episode_slots and the variant (tests/test_exp008.py checks this). C keeps the
# EXP-006 duals: eta 2, mu_max 50, training init uniform in [0, 50], execution mu0 5.
# A-600 is not retrained: it reuses outputs/exp008-round1/r0-seed101 and r0-seed202.
# Seeds 101 and 202, 5M slots each.
[experiment]
id = "exp008-training-signal"
design = "docs/experiment-designs/008-training-signal_20261002.md"
round = 2
condition = "C-600"
variant = "local"
seeds = [101, 202]
b1 = "R0"
inherits = "configs/exp008-round1-r0.toml"

[training]
budget_slots = 5000000
episode_slots = 600
env_ues = [4, 4, 6, 6, 8, 8, 10, 10, 12, 12, 16, 16, 20, 20]
rollout_slots = 128
entropy_start = 0.01
entropy_decay_fraction = 0.5
checkpoint_every_slots = 1000000
torch_threads = 1

[model]
hidden = 64
critic_hidden = 256

[ppo]
actor_lr = 3e-4
critic_lr = 1e-3
gamma = 0.99
gae_lambda = 0.95
clip = 0.2
max_grad_norm = 0.5
ppo_epochs = 4
minibatch_envs = 4

[update]
advantage_norm = "global"
actor_loss_weighting = "ue"
value_norm = "none"

# Reliability-only reward: -(1/N) sum_i mu_i c_i (EXP-006 variant A).
[constraint.fixed]
weight = 1.0

[constraint.local]
eta = 2.0
mu_max = 50.0
mu0 = 5.0
