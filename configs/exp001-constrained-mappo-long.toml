# EXP-DSA05-001 phase 2 long training (design §10). Identical to
# exp001-constrained-mappo.toml except the budget (20M slots, entropy decaying
# over the first 10M) and the validation interval (every 1M slots). The
# constraint settings are the phase-1 selections at N=8, not re-tuned for N=12.
[experiment]
id = "exp001-constrained-mappo-long"
design = "docs/experiment-designs/001-constrained-mappo_20260924.md"

[training]
budget_slots = 20000000
episode_slots = 600
num_envs = 16
rollout_slots = 128
entropy_start = 0.01
entropy_decay_fraction = 0.5
validation_every_slots = 1000000
torch_threads = 1

[model]
hidden = 64
critic_hidden = 256

[ppo]
actor_lr = 3e-4
critic_lr = 1e-3
gamma = 0.99
gae_lambda = 0.95
clip = 0.2
max_grad_norm = 0.5
ppo_epochs = 4
minibatch_envs = 4

# Penalty weights are in units of one max-power slot of energy, E0 = tau * p_max.
[constraint.fixed]
weight = 10.0

[constraint.global]
eta = 5.0
mu_init = 5.0
mu_max = 100.0

[constraint.local]
eta = 2.0
mu_max = 50.0
mu0 = 5.0
# Initial duals evaluated at every validation; the protocol rule picks (checkpoint, mu0).
mu0_candidates = [0.0, 5.0, 25.0]

# Phase-1 selections (docs/results/exp001-phase1_20260925/report.md).
[profiles.fixed-w10]
variant = "fixed"
weight = 10.0

[profiles.local-eta2]
variant = "local"
eta = 2.0
mu_max = 50.0
