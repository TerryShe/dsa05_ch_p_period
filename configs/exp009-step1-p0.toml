# EXP-DSA05-009 step 1, condition P0: the R0 algorithm (EXP-006 variant A) trained
# per N (design §2, §4): one run per N in per_n and seed, all 14 environments with
# that N (--num-ues), uniform training deployments. Apart from [experiment] and
# num_envs replacing the mixed env_ues, the file equals configs/exp008-round1-r0.toml
# (tests/test_exp009.py checks this). 5M slots per run.
[experiment]
id = "exp009-per-n"
design = "docs/experiment-designs/009-per-n-training-hard-deployments_20261004.md"
step = 1
condition = "P0"
variant = "fixed"
seeds = [101, 202]
per_n = [2, 4, 6, 8, 10, 12, 16, 20]
inherits = "configs/exp008-round1-r0.toml"

[training]
budget_slots = 5000000
episode_slots = 600
num_envs = 14  # all with the N given by --num-ues
rollout_slots = 128
entropy_start = 0.01
entropy_decay_fraction = 0.5
checkpoint_every_slots = 1000000
torch_threads = 1

[model]
hidden = 64
critic_hidden = 256

[ppo]
actor_lr = 3e-4
critic_lr = 1e-3
gamma = 0.99
gae_lambda = 0.95
clip = 0.2
max_grad_norm = 0.5
ppo_epochs = 4
minibatch_envs = 4

[update]
advantage_norm = "global"
actor_loss_weighting = "ue"
value_norm = "none"

# Reliability-only reward: -(1/N) sum_i mu_i c_i (EXP-006 variant A).
[constraint.fixed]
weight = 1.0

[constraint.local]
eta = 2.0
mu_max = 50.0
mu0 = 5.0

[sampler]
kind = "uniform"
