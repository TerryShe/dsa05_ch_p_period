# EXP-DSA05-009 step 2, condition S1: static hard strata: with probability 0.5 a deployment below tau_N (design §5.1).
# Step 1 chose B = M0 (mixed training; docs/results/exp009-step1_20261004/report.md),
# so the condition trains with R0's mixed environments and one sampler per N group.
# Apart from [experiment] and [sampler] the file equals configs/exp008-round1-r0.toml
# (tests/test_exp009.py checks this). Seeds 101 and 202, 5M slots each.
[experiment]
id = "exp009-hard-deployments"
design = "docs/experiment-designs/009-per-n-training-hard-deployments_20261004.md"
step = 2
condition = "S1"
variant = "fixed"
seeds = [101, 202]
base = "M0"
inherits = "configs/exp008-round1-r0.toml"

[training]
budget_slots = 5000000
episode_slots = 600
env_ues = [4, 4, 6, 6, 8, 8, 10, 10, 12, 12, 16, 16, 20, 20]
rollout_slots = 128
entropy_start = 0.01
entropy_decay_fraction = 0.5
checkpoint_every_slots = 1000000
torch_threads = 1

[model]
hidden = 64
critic_hidden = 256

[ppo]
actor_lr = 3e-4
critic_lr = 1e-3
gamma = 0.99
gae_lambda = 0.95
clip = 0.2
max_grad_norm = 0.5
ppo_epochs = 4
minibatch_envs = 4

[update]
advantage_norm = "global"
actor_loss_weighting = "ue"
value_norm = "none"

# Reliability-only reward: -(1/N) sum_i mu_i c_i (EXP-006 variant A).
[constraint.fixed]
weight = 1.0

[constraint.local]
eta = 2.0
mu_max = 50.0
mu0 = 5.0

[sampler]
kind = "stratified"
hard_share = 0.5

# configs/exp009-tau.toml (frozen; tests check the copy)
[sampler.tau]
"2" = 3.5470138046803963
"4" = 2.9212198525440263
"6" = 2.6487739515504347
"8" = 2.519029717893554
"10" = 2.4315962174293846
"12" = 2.372875297249997
"16" = 2.2831118347237895
"20" = 2.2349918632173504
