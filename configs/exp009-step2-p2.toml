# EXP-DSA05-009 step 2, condition P2: PLR with the worst UE's avoidable violation rate (design §5.2, §5.3).
# Step 1 chose B = M0 (mixed training; docs/results/exp009-step1_20261004/report.md),
# so the condition trains with R0's mixed environments and one sampler per N group.
# Apart from [experiment] and [sampler] the file equals configs/exp008-round1-r0.toml
# (tests/test_exp009.py checks this). Seeds 101 and 202, 5M slots each.
[experiment]
id = "exp009-hard-deployments"
design = "docs/experiment-designs/009-per-n-training-hard-deployments_20261004.md"
step = 2
condition = "P2"
variant = "fixed"
seeds = [101, 202]
base = "M0"
inherits = "configs/exp008-round1-r0.toml"

[training]
budget_slots = 5000000
episode_slots = 600
env_ues = [4, 4, 6, 6, 8, 8, 10, 10, 12, 12, 16, 16, 20, 20]
rollout_slots = 128
entropy_start = 0.01
entropy_decay_fraction = 0.5
checkpoint_every_slots = 1000000
torch_threads = 1

[model]
hidden = 64
critic_hidden = 256

[ppo]
actor_lr = 3e-4
critic_lr = 1e-3
gamma = 0.99
gae_lambda = 0.95
clip = 0.2
max_grad_norm = 0.5
ppo_epochs = 4
minibatch_envs = 4

[update]
advantage_norm = "global"
actor_loss_weighting = "ue"
value_norm = "none"

# Reliability-only reward: -(1/N) sum_i mu_i c_i (EXP-006 variant A).
[constraint.fixed]
weight = 1.0

[constraint.local]
eta = 2.0
mu_max = 50.0
mu0 = 5.0

[sampler]
kind = "plr"
score = "avoidable"
replay_probability = 0.5
buffer_size = 500
min_fill = 50
beta = 0.1
rho = 0.1
