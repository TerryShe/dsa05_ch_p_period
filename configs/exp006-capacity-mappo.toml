# EXP-DSA05-006 phase 1: screening of variants A (fixed) and C (local), 2 seeds
# each, 5M slots (docs/experiment-designs/006-learned-coordination_20261001.md §4.1).
[experiment]
id = "exp006-capacity-mappo"
design = "docs/experiment-designs/006-learned-coordination_20261001.md"

[training]
budget_slots = 5000000
episode_slots = 600
env_ues = [4, 4, 6, 6, 8, 8, 10, 10, 12, 12, 16, 16, 20, 20]
rollout_slots = 128
entropy_start = 0.01
entropy_decay_fraction = 0.5
checkpoint_every_slots = 1000000
torch_threads = 1

[model]
hidden = 64
critic_hidden = 256

[ppo]
actor_lr = 3e-4
critic_lr = 1e-3
gamma = 0.99
gae_lambda = 0.95
clip = 0.2
max_grad_norm = 0.5
ppo_epochs = 4
minibatch_envs = 4

# Reliability-only reward: -(1/N) sum_i mu_i c_i. PPO normalizes advantages,
# so the fixed weight only scales the critic targets.
[constraint.fixed]
weight = 1.0

[constraint.local]
eta = 2.0
mu_max = 50.0
mu0 = 5.0
