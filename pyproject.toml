[project]
name = "dsa-period"
version = "0.1.0.dev0"
description = "Distributed subchannel and power control for asynchronous periodic uplink traffic"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2,<3",
]

[build-system]
requires = ["uv_build==0.9.28"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
# MILP (HiGHS) and max-flow for the central time-sharing bounds.
analysis = [
    "highspy>=1.11,<2",
    "matplotlib>=3.9,<4",
    "scipy>=1.15,<2",
]
training = [
    "torch>=2.6,<3",
]

[tool.uv]
default-groups = ["dev", "analysis", "training"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
